name: Moto Reto - APK demo
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/moto-reto.yml']
permissions:
  contents: write
concurrency:
  group: moto-reto-demo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recuperar proyecto verificado
        shell: python
        run: |
          import base64, hashlib, io, pathlib, tarfile
          source = pathlib.Path('.github/workflows/moto-reto.yml').read_text()
          blob = base64.b64decode(''.join(line[len('# MOTO_PAYLOAD '):] for line in source.splitlines() if line.startswith('# MOTO_PAYLOAD ')), validate=True)
          if hashlib.sha256(blob).hexdigest() != '28db4e421d66545ec4f921f88b5e7a794028a92def6a281cdf85ef2299be71df':
              raise SystemExit('Proyecto incompleto o modificado')
          destination = pathlib.Path('_moto_reto')
          destination.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:xz') as tar:
              for member in tar.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  if not member.isfile() or p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Ruta de archivo no permitida')
              tar.extractall(destination, filter='data')
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Probar reglas de juego
        working-directory: _moto_reto
        run: sh tests/run.sh
      - name: Compilar y revisar Android
        working-directory: _moto_reto
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: Publicar APK de prueba en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN: ${{ github.run_id }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, zipfile
          root = pathlib.Path('_moto_reto')
          apk = root / 'app/build/outputs/apk/debug/app-debug.apk'
          source = pathlib.Path('Moto-Reto-Codigo.zip')
          with zipfile.ZipFile(source, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  parts = p.relative_to(root).parts
                  if p.is_file() and not any(v in {'.gradle', 'build', 'classes'} for v in parts) and p.suffix != '.class' and p.name != 'local.properties':
                      z.write(p, str(pathlib.Path('Moto-Reto') / p.relative_to(root)))
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'MotoReto-DemoBuilder'}
          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          tag = 'demo-' + os.environ['GH_RUN'] + '-' + os.environ.get('GITHUB_RUN_ATTEMPT', '1')
          body = {'tag_name': tag, 'target_commitish': os.environ['GITHUB_SHA'], 'name': 'Moto Reto 0.1 - DEMO', 'prerelease': True, 'body': 'Primera prueba: moto, tráfico, 60 segundos, adelantamientos, récord y sonido. Gráficos ilustrados provisionales. Sin anuncios ni servidor. Solo para pruebas: firma pública de desarrollo, paquete com.motoreto.demo. Antes de publicar el juego definitivo se usará otra identidad y firma privada.'}
          req = urllib.request.Request(base + '/releases', data=json.dumps(body).encode(), headers={**headers, 'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          upload = release['upload_url'].split('{')[0]
          for path, name, mime in [(apk, 'Moto-Reto-0.1-demo.apk', 'application/vnd.android.package-archive'), (source, source.name, 'application/zip')]:
              req = urllib.request.Request(upload + '?name=' + name, data=path.read_bytes(), headers={**headers, 'Content-Type':mime}, method='POST')
              with urllib.request.urlopen(req, timeout=120) as response:
                  json.load(response)
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Moto Reto - APK demo\n\n[Descargar desde Releases](' + release['html_url'] + ')\n\nSHA256: `' + sha + '`\n')

