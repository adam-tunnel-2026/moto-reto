name: Moto Reto - APK demo 3D
'on':
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/moto-reto-listo.yml
permissions:
  contents: write
concurrency:
  group: moto-reto-demo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Comprobar repositorio de destino
      run: test "$GITHUB_REPOSITORY" = "adam-tunnel-2026/moto-reto"
    - name: Conservar copia del repositorio
      shell: python
      run: |
        import pathlib,zipfile
        root=pathlib.Path('.')
        backup=pathlib.Path('_moto_backup');backup.mkdir(exist_ok=True)
        files=[p for p in root.rglob('*') if p.is_file() and not any(part in {'.git','_moto_backup','_moto_reto'} for part in p.parts)]
        with zipfile.ZipFile(backup/'Moto-Reto-antes-de-compilar.zip','w',zipfile.ZIP_DEFLATED,strict_timestamps=False) as out:
            for p in files:out.write(p,p.as_posix())
        with zipfile.ZipFile(backup/'Moto-Reto-antes-de-compilar.zip') as archive:
            if archive.testzip():raise SystemExit('La copia de seguridad no supera CRC')
        print('Copia verificada:',len(files),'archivos')
    - name: Guardar copia de seguridad
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Copia-seguridad
        path: _moto_backup/Moto-Reto-antes-de-compilar.zip
        if-no-files-found: error
        retention-days: 30
    - name: Recuperar proyecto 3D verificado
      shell: python
      run: |
        import base64,hashlib,io,pathlib,tarfile
        source=pathlib.Path('.github/workflows/moto-reto-listo.yml').read_text()
        blob=base64.b64decode(''.join(line[len('# MOTO_PAYLOAD '):] for line in source.splitlines() if line.startswith('# MOTO_PAYLOAD ')),validate=True)
        if hashlib.sha256(blob).hexdigest()!='edd08cc0d03acebd42d43da96d079fba26febbdf15deeecda08ec64227da2762':
            raise SystemExit('El proyecto está incompleto o modificado.')
        root=pathlib.Path('_moto_reto');root.mkdir(exist_ok=True)
        with tarfile.open(fileobj=io.BytesIO(blob),mode='r:xz') as tar:
            for member in tar.getmembers():
                path=pathlib.PurePosixPath(member.name)
                if not member.isfile() or path.is_absolute() or '..' in path.parts:
                    raise SystemExit('Ruta no permitida')
            tar.extractall(root,filter='data')
    - name: Preparar efectos de conducción
      run: python3 _moto_reto/tools/make_effects.py
    - name: Preparar herramientas de recursos y render
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers vulkan-tools xauth
        python3 -m pip install 'Pillow>=11,<13'
    - name: Comprobar controlador Vulkan por software
      shell: python
      run: |
        import os,pathlib,subprocess
        candidates=sorted(pathlib.Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
        if not candidates:
            raise SystemExit('Mesa Lavapipe no está instalado. Se detiene antes de importar los modelos.')
        driver=str(candidates[0])
        runtime=pathlib.Path(os.environ['RUNNER_TEMP'])/'moto-runtime'
        runtime.mkdir(mode=0o700,exist_ok=True)
        runtime.chmod(0o700)
        env=dict(os.environ,VK_DRIVER_FILES=driver,VK_ICD_FILENAMES=driver,LIBGL_ALWAYS_SOFTWARE='1',XDG_RUNTIME_DIR=str(runtime))
        result=subprocess.run(['xvfb-run','-a','-s','-screen 0 720x1280x24','vulkaninfo','--summary'],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=60)
        print(result.stdout,flush=True)
        if result.returncode or 'VK_KHR_surface' not in result.stdout or not any(name in result.stdout.lower() for name in ['llvmpipe','lavapipe']):
            raise SystemExit('El controlador Vulkan por CPU no supera la prueba previa. No se importa ni publica la APK.')
        with open(os.environ['GITHUB_ENV'],'a') as out:
            for key in ['VK_DRIVER_FILES','VK_ICD_FILENAMES','LIBGL_ALWAYS_SOFTWARE','XDG_RUNTIME_DIR']:
                out.write(key+'='+env[key]+'\n')
        print('MOTO_VULKAN_SOFTWARE_OK: '+driver)
    - name: Recuperar recursos preparados
      id: asset-cache
      uses: actions/cache@v4
      with:
        path: |-
          _moto_reto/assets/models
          _moto_reto/assets/textures
          _moto_reto/assets/environment
          _moto_reto/assets/receipts.json
          _moto_reto/audio/engine.wav
          _moto_reto/audio/sources
          _moto_reto/CREDITS.txt
        key: moto-assets-v1-${{ hashFiles('_moto_reto/assets/sources.json', '_moto_reto/tools/prepare_assets.py')
          }}
    - name: Descargar y preparar modelos, texturas y motor grabado
      if: steps.asset-cache.outputs.cache-hit != 'true'
      run: python3 _moto_reto/tools/prepare_assets.py
    - name: Guardar fuentes y licencias comprobadas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Fuentes-y-Creditos
        path: |-
          _moto_reto/assets/receipts.json
          _moto_reto/CREDITS.txt
        if-no-files-found: warn
    - name: Revisar estructura
      run: python3 _moto_reto/tests/verify_project.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: 'false'
    - name: Preparar SDK Android
      run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
    - name: Instalar Godot y plantilla oficiales
      shell: python
      run: |
        import hashlib,os,pathlib,shutil,urllib.request,zipfile
        base='https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/'
        cache=pathlib.Path('_godot_download');cache.mkdir(exist_ok=True)
        def download(name):
            target=cache/name
            request=urllib.request.Request(base+name,headers={'User-Agent':'MotoReto3D-Build'})
            with urllib.request.urlopen(request,timeout=120) as source,target.open('wb') as out:
                shutil.copyfileobj(source,out,1024*1024)
            return target
        checks=download('SHA512-SUMS.txt').read_text()
        expected={line.split()[-1].lstrip('*'):line.split()[0] for line in checks.splitlines() if len(line.split())>=2}
        def verified(name):
            target=download(name);sha=hashlib.sha512()
            with target.open('rb') as stream:
                for block in iter(lambda:stream.read(1024*1024),b''):sha.update(block)
            if sha.hexdigest()!=expected.get(name):raise SystemExit('La descarga de Godot no coincide: '+name)
            return target
        engine=verified('Godot_v4.4.1-stable_linux.x86_64.zip')
        bin_dir=pathlib.Path('_godot_bin');bin_dir.mkdir(exist_ok=True)
        with zipfile.ZipFile(engine) as archive:
            payload=archive.read('Godot_v4.4.1-stable_linux.x86_64')
        exe=bin_dir/'godot';exe.write_bytes(payload);exe.chmod(0o755)
        with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(bin_dir.resolve())+'\n')
        templates=verified('Godot_v4.4.1-stable_export_templates.tpz')
        destination=pathlib.Path.home()/'.local/share/godot/export_templates/4.4.1.stable'
        destination.mkdir(parents=True,exist_ok=True)
        with zipfile.ZipFile(templates) as archive:
            with archive.open('templates/android_debug.apk') as source,(destination/'android_debug.apk').open('wb') as out:
                shutil.copyfileobj(source,out,1024*1024)
        templates.unlink()
        config=pathlib.Path.home()/'.config/godot';config.mkdir(parents=True,exist_ok=True)
        sdk=os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME']
        java=os.environ['JAVA_HOME']
        settings='[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "'+sdk+'"\nexport/android/java_sdk_path = "'+java+'"\n'
        (config/'editor_settings-4.4.tres').write_text(settings)
        print('Motor y plantilla oficiales verificados con SHA512. SDK configurado.')
    - name: Importar y comprobar scripts
      working-directory: _moto_reto
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --editor --path . --import --quit
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
    - name: Probar reglas de carrera
      working-directory: _moto_reto
      run: python3 tools/run_checked.py godot --headless --path . --quit-after 120 --script res://tests/race_test.gd
    - name: Probar carrocerías e interfaz táctil
      working-directory: _moto_reto
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --quit-after 120 --script res://tests/visual_test.gd
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
    - name: Probar caída articulada y reinicio
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/crash_test.gd
    - name: Preparar captura 3D
      run: |
        mkdir -p _moto_reto/build
    - name: Abrir escena y guardar captura REAL
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-3D-Captura.png
      run: |-
        python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture
        python3 - <<'PYTEST'
        from pathlib import Path
        p=Path('build/Moto-Reto-3D-Captura.png')
        assert p.is_file() and p.stat().st_size>10000,'Falta una captura válida'
        assert p.read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
        print('Captura real de Godot guardada')
        PYTEST
    - name: Renderizar caída para revisión
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-3D-Caida.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-crash
    - name: Guardar captura para revisión
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Captura-Real
        path: |-
          _moto_reto/build/Moto-Reto-3D-Captura.png
          _moto_reto/build/Moto-Reto-3D-Caida.png
        if-no-files-found: warn
    - name: Exportar APK Android
      working-directory: _moto_reto
      env:
        GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/_moto_reto/demo.keystore
        GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
        GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: |-
        python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --export-debug 'Android Demo' build/Moto-Reto-0.6.1-Costa.apk
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/Moto-Reto-0.6.1-Costa.apk
    - name: Guardar APK descargable
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-APK
        path: _moto_reto/build/Moto-Reto-0.6.1-Costa.apk
        if-no-files-found: error
    - name: Publicar APK y captura en Releases
      env:
        GH_TOKEN: ${{ github.token }}
      shell: python
      run: |
        import hashlib,json,os,pathlib,urllib.request,zipfile
        root=pathlib.Path('_moto_reto');apk=root/'build/Moto-Reto-0.6.1-Costa.apk';capture=root/'build/Moto-Reto-3D-Captura.png'
        fall_capture=root/'build/Moto-Reto-3D-Caida.png'
        if not apk.is_file() or not capture.is_file() or not fall_capture.is_file():raise SystemExit('Falta APK o captura real. No se publica.')
        source=pathlib.Path('Moto-Reto-3D-Codigo.zip')
        with zipfile.ZipFile(source,'w',zipfile.ZIP_DEFLATED,strict_timestamps=False) as archive:
            for p in sorted(root.rglob('*')):
                if p.is_file() and not any(v in {'.godot','build','__pycache__'} for v in p.relative_to(root).parts):
                    archive.write(p,str(pathlib.Path('Moto-Reto-3D')/p.relative_to(root)))
        headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'MotoReto3D-Build'}
        base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
        tag='demo-3d-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ.get('GITHUB_RUN_ATTEMPT','1')
        body={'tag_name':tag,'target_commitish':os.environ['GITHUB_SHA'],'name':'Moto Reto 0.6.1 - Costa','prerelease':True,'body':'Moto Reto 0.6.1: pedales de coche, aceleración hasta 320 km/h, cuerpo completo del piloto restaurado al corregir la mezcla de mallas indexadas, orientación de la moto contrastada con la matrícula, caída física de diez partes articuladas sin sangre ni interacción con otros vehículos o animales, cámara de seguimiento y pausa, gaviotas animadas, palomas GLB y arbustos CC0. Incluye pruebas de geometría, velocidad y caída, dos capturas reales y fuentes. Piloto y gaviotas con geometría propia; el acabado aún no es fotorrealista. Deben revisarse capturas y rendimiento en Android. Paquete com.motoreto.demo y firma de pruebas conservados, versionCode 11.'}
        req=urllib.request.Request(base+'/releases',data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='POST')
        with urllib.request.urlopen(req,timeout=30) as response:release=json.load(response)
        upload=release['upload_url'].split('{')[0]
        for path,mime in [(apk,'application/vnd.android.package-archive'),(capture,'image/png'),(fall_capture,'image/png'),(source,'application/zip')]:
            req=urllib.request.Request(upload+'?name='+path.name,data=path.read_bytes(),headers={**headers,'Content-Type':mime},method='POST')
            with urllib.request.urlopen(req,timeout=120) as response:json.load(response)
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write('## Moto Reto 3D\n\n[APK y captura real]('+release['html_url']+')\n\nSHA256 APK: `'+hashlib.sha256(apk.read_bytes()).hexdigest()+'`\n')
    - name: Guardar registros completos de Godot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Registros
        path: _moto_reto/build/validation/*.log
        if-no-files-found: warn

