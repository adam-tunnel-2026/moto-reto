name: Moto Reto - APK demo 3D
'on':
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/moto-reto-listo.yml
permissions:
  contents: write
concurrency:
  group: moto-reto-demo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Comprobar repositorio de destino
      run: test "$GITHUB_REPOSITORY" = "adam-tunnel-2026/moto-reto"
    - name: Conservar copia del repositorio
      shell: python
      run: "import pathlib,zipfile\nroot=pathlib.Path('.')\nbackup=pathlib.Path('_moto_backup');backup.mkdir(exist_ok=True)\n\
        files=[p for p in root.rglob('*') if p.is_file() and not any(part in {'.git','_moto_backup','_moto_reto'}\
        \ for part in p.parts)]\nwith zipfile.ZipFile(backup/'Moto-Reto-antes-de-compilar.zip','w',zipfile.ZIP_DEFLATED,strict_timestamps=False)\
        \ as out:\n    for p in files:out.write(p,p.as_posix())\nwith zipfile.ZipFile(backup/'Moto-Reto-antes-de-compilar.zip')\
        \ as archive:\n    if archive.testzip():raise SystemExit('La copia de seguridad no supera CRC')\nprint('Copia\
        \ verificada:',len(files),'archivos')\n"
    - name: Guardar copia de seguridad
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Copia-seguridad
        path: _moto_backup/Moto-Reto-antes-de-compilar.zip
        if-no-files-found: error
        retention-days: 30
    - name: Recuperar proyecto 3D verificado
      shell: python
      run: "import base64,hashlib,io,pathlib,tarfile\nsource=pathlib.Path('.github/workflows/moto-reto-listo.yml').read_text()\n\
        blob=base64.b64decode(''.join(line[len('# MOTO_PAYLOAD '):] for line in source.splitlines() if line.startswith('#\
        \ MOTO_PAYLOAD ')),validate=True)\nif hashlib.sha256(blob).hexdigest()!='5796eb1b9f811bfcd32104e9b1fc255ec9a542c535f822aec2ea3bb1fcdfc73d':\n\
        \    raise SystemExit('El proyecto está incompleto o modificado.')\nroot=pathlib.Path('_moto_reto');root.mkdir(exist_ok=True)\n\
        with tarfile.open(fileobj=io.BytesIO(blob),mode='r:xz') as tar:\n    for member in tar.getmembers():\n \
        \       path=pathlib.PurePosixPath(member.name)\n        if not member.isfile() or path.is_absolute() or\
        \ '..' in path.parts:\n            raise SystemExit('Ruta no permitida')\n    tar.extractall(root,filter='data')\n"
    - name: Preparar efectos de conducción
      run: python3 _moto_reto/tools/make_effects.py
    - name: Preparar herramientas de recursos y render
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers vulkan-tools xauth

        python3 -m pip install ''Pillow>=11,<13''

        '
    - name: Comprobar controlador Vulkan por software
      shell: python
      run: "import os,pathlib,subprocess\ncandidates=sorted(pathlib.Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))\n\
        if not candidates:\n    raise SystemExit('Mesa Lavapipe no está instalado. Se detiene antes de importar\
        \ los modelos.')\ndriver=str(candidates[0])\nruntime=pathlib.Path(os.environ['RUNNER_TEMP'])/'moto-runtime'\n\
        runtime.mkdir(mode=0o700,exist_ok=True)\nruntime.chmod(0o700)\nenv=dict(os.environ,VK_DRIVER_FILES=driver,VK_ICD_FILENAMES=driver,LIBGL_ALWAYS_SOFTWARE='1',XDG_RUNTIME_DIR=str(runtime))\n\
        result=subprocess.run(['xvfb-run','-a','-s','-screen 0 720x1280x24','vulkaninfo','--summary'],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=60)\n\
        print(result.stdout,flush=True)\nif result.returncode or 'VK_KHR_surface' not in result.stdout or not any(name\
        \ in result.stdout.lower() for name in ['llvmpipe','lavapipe']):\n    raise SystemExit('El controlador Vulkan\
        \ por CPU no supera la prueba previa. No se importa ni publica la APK.')\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as out:\n    for key in ['VK_DRIVER_FILES','VK_ICD_FILENAMES','LIBGL_ALWAYS_SOFTWARE','XDG_RUNTIME_DIR']:\n\
        \        out.write(key+'='+env[key]+'\\n')\nprint('MOTO_VULKAN_SOFTWARE_OK: '+driver)\n"
    - name: Recuperar recursos preparados
      id: asset-cache
      uses: actions/cache@v4
      with:
        path: '_moto_reto/assets/models

          _moto_reto/assets/textures

          _moto_reto/assets/environment

          _moto_reto/assets/receipts.json

          _moto_reto/audio/engine.wav

          _moto_reto/audio/sources

          _moto_reto/CREDITS.txt'
        key: moto-assets-v1-${{ hashFiles('_moto_reto/assets/sources.json', '_moto_reto/tools/prepare_assets.py')
          }}
    - name: Descargar y preparar modelos, texturas y motor grabado
      if: steps.asset-cache.outputs.cache-hit != 'true'
      run: python3 _moto_reto/tools/prepare_assets.py
    - name: Guardar fuentes y licencias comprobadas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Fuentes-y-Creditos
        path: '_moto_reto/assets/receipts.json

          _moto_reto/CREDITS.txt'
        if-no-files-found: warn
    - name: Revisar estructura
      run: python3 _moto_reto/tests/verify_project.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: 'false'
    - name: Preparar SDK Android
      run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
    - name: Instalar Godot y plantilla oficiales
      shell: python
      run: "import hashlib,os,pathlib,shutil,urllib.request,zipfile\nbase='https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/'\n\
        cache=pathlib.Path('_godot_download');cache.mkdir(exist_ok=True)\ndef download(name):\n    target=cache/name\n\
        \    request=urllib.request.Request(base+name,headers={'User-Agent':'MotoReto3D-Build'})\n    with urllib.request.urlopen(request,timeout=120)\
        \ as source,target.open('wb') as out:\n        shutil.copyfileobj(source,out,1024*1024)\n    return target\n\
        checks=download('SHA512-SUMS.txt').read_text()\nexpected={line.split()[-1].lstrip('*'):line.split()[0] for\
        \ line in checks.splitlines() if len(line.split())>=2}\ndef verified(name):\n    target=download(name);sha=hashlib.sha512()\n\
        \    with target.open('rb') as stream:\n        for block in iter(lambda:stream.read(1024*1024),b''):sha.update(block)\n\
        \    if sha.hexdigest()!=expected.get(name):raise SystemExit('La descarga de Godot no coincide: '+name)\n\
        \    return target\nengine=verified('Godot_v4.4.1-stable_linux.x86_64.zip')\nbin_dir=pathlib.Path('_godot_bin');bin_dir.mkdir(exist_ok=True)\n\
        with zipfile.ZipFile(engine) as archive:\n    payload=archive.read('Godot_v4.4.1-stable_linux.x86_64')\n\
        exe=bin_dir/'godot';exe.write_bytes(payload);exe.chmod(0o755)\nwith open(os.environ['GITHUB_PATH'],'a')\
        \ as out:out.write(str(bin_dir.resolve())+'\\n')\ntemplates=verified('Godot_v4.4.1-stable_export_templates.tpz')\n\
        destination=pathlib.Path.home()/'.local/share/godot/export_templates/4.4.1.stable'\ndestination.mkdir(parents=True,exist_ok=True)\n\
        with zipfile.ZipFile(templates) as archive:\n    with archive.open('templates/android_debug.apk') as source,(destination/'android_debug.apk').open('wb')\
        \ as out:\n        shutil.copyfileobj(source,out,1024*1024)\ntemplates.unlink()\nconfig=pathlib.Path.home()/'.config/godot';config.mkdir(parents=True,exist_ok=True)\n\
        sdk=os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME']\njava=os.environ['JAVA_HOME']\nsettings='[gd_resource\
        \ type=\"EditorSettings\" format=3]\\n\\n[resource]\\nexport/android/android_sdk_path = \"'+sdk+'\"\\nexport/android/java_sdk_path\
        \ = \"'+java+'\"\\n'\n(config/'editor_settings-4.4.tres').write_text(settings)\nprint('Motor y plantilla\
        \ oficiales verificados con SHA512. SDK configurado.')\n"
    - name: Importar y comprobar scripts
      working-directory: _moto_reto
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --editor --path . --import --quit
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
    - name: Probar reglas de carrera
      working-directory: _moto_reto
      run: python3 tools/run_checked.py godot --headless --path . --quit-after 120 --script res://tests/race_test.gd
    - name: Probar niveles, candados y guardado
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/campaign_test.gd
    - name: Probar créditos legibles y avisos completos
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --quit-after 120 --script res://tests/credits_test.gd
    - name: Probar carrocerías e interfaz táctil
      working-directory: _moto_reto
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --quit-after 120 --script res://tests/visual_test.gd
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
    - name: Probar caída articulada y reinicio
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/crash_test.gd
    - name: Preparar captura 3D
      run: 'mkdir -p _moto_reto/build

        '
    - name: Abrir escena y guardar captura REAL
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-3D-Captura.png
      run: 'python3 tools/run_checked.py xvfb-run -a -s ''-screen 0 720x1280x24'' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture

        python3 - <<''PYTEST''

        from pathlib import Path

        p=Path(''build/Moto-Reto-3D-Captura.png'')

        assert p.is_file() and p.stat().st_size>10000,''Falta una captura válida''

        assert p.read_bytes()[:8]==b''\x89PNG\r\n\x1a\n''

        print(''Captura real de Godot guardada'')

        PYTEST'
    - name: Renderizar caída para revisión
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-3D-Caida.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-crash
    - name: Renderizar curva para revisión
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-3D-Curva.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-curve
    - name: Renderizar mapa de niveles
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-Mapa.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-map
    - name: Renderizar Montaña
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-mountain.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-mountain
    - name: Renderizar Ciudad
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-city.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-city
    - name: Renderizar Puerto
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-port.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-port
    - name: Renderizar pantalla de créditos para revisión
      working-directory: _moto_reto
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MOTO_CAPTURE_PATH: ${{ github.workspace }}/_moto_reto/build/Moto-Reto-Creditos.png
      run: python3 tools/run_checked.py xvfb-run -a -s '-screen 0 720x1280x24' godot --path . --rendering-method
        gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 540x960 -- --capture --capture-credits
    - name: Guardar captura para revisión
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Captura-Real
        path: '_moto_reto/build/Moto-Reto-3D-Captura.png

          _moto_reto/build/Moto-Reto-3D-Caida.png

          _moto_reto/build/Moto-Reto-3D-Curva.png

          _moto_reto/build/Moto-Reto-Mapa.png

          _moto_reto/build/Moto-Reto-mountain.png

          _moto_reto/build/Moto-Reto-city.png

          _moto_reto/build/Moto-Reto-port.png

          _moto_reto/build/Moto-Reto-Creditos.png'
        if-no-files-found: warn
    - name: Exportar APK Android
      working-directory: _moto_reto
      env:
        GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/_moto_reto/demo.keystore
        GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
        GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: 'python3 tools/run_checked.py xvfb-run -a -s ''-screen 0 720x1280x24'' godot --rendering-method gl_compatibility
        --rendering-driver opengl3 --audio-driver Dummy --path . --export-debug ''Android Demo'' build/Moto-Reto-0.9.2-Creditos.apk

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/Moto-Reto-0.9.2-Creditos.apk'
    - name: Guardar APK descargable
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-APK
        path: _moto_reto/build/Moto-Reto-0.9.2-Creditos.apk
        if-no-files-found: error
    - name: Publicar APK y captura en Releases
      env:
        GH_TOKEN: ${{ github.token }}
      shell: python
      run: "import hashlib,json,os,pathlib,urllib.request,zipfile\nroot=pathlib.Path('_moto_reto');apk=root/'build/Moto-Reto-0.9.2-Creditos.apk';capture=root/'build/Moto-Reto-3D-Captura.png'\n\
        credits_capture=root/'build/Moto-Reto-Creditos.png'\nif not credits_capture.is_file():raise SystemExit('Falta\
        \ captura de créditos')\nfall_capture=root/'build/Moto-Reto-3D-Caida.png'\ncurve_capture=root/'build/Moto-Reto-3D-Curva.png'\n\
        map_capture=root/'build/Moto-Reto-Mapa.png'\nbiome_captures=[root/'build'/('Moto-Reto-'+name+'.png') for\
        \ name in ['mountain','city','port']]\nif not all(p.is_file() for p in biome_captures):raise SystemExit('Faltan\
        \ capturas de etapas')\nif not apk.is_file() or not capture.is_file() or not fall_capture.is_file() or not\
        \ curve_capture.is_file() or not map_capture.is_file():raise SystemExit('Falta APK o captura real. No se\
        \ publica.')\nsource=pathlib.Path('Moto-Reto-3D-Codigo.zip')\nwith zipfile.ZipFile(source,'w',zipfile.ZIP_DEFLATED,strict_timestamps=False)\
        \ as archive:\n    for p in sorted(root.rglob('*')):\n        if p.is_file() and not any(v in {'.godot','build','__pycache__'}\
        \ for v in p.relative_to(root).parts):\n            archive.write(p,str(pathlib.Path('Moto-Reto-3D')/p.relative_to(root)))\n\
        headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'MotoReto3D-Build'}\n\
        base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']\ntag='demo-3d-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ.get('GITHUB_RUN_ATTEMPT','1')\n\
        body={'tag_name':tag,'target_commitish':os.environ['GITHUB_SHA'],'name':'Moto Reto 0.9.2 - Creditos legibles','prerelease':True,'body':'Pantalla\
        \ Acerca de con logo Moto Reto, créditos de recursos y licencias completas en pestañas separadas. Avisos\
        \ de Godot y terceros formateados como texto legible, sin JSON crudo. Conserva contenido, veinte niveles,\
        \ firma y progreso de 0.9.1. versionCode 17. Incluye captura real de la nueva pantalla y comprobación de\
        \ que se conserva cada aviso y texto de licencia.'}\nreq=urllib.request.Request(base+'/releases',data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='POST')\n\
        with urllib.request.urlopen(req,timeout=30) as response:release=json.load(response)\nupload=release['upload_url'].split('{')[0]\n\
        for path,mime in [(apk,'application/vnd.android.package-archive'),(capture,'image/png'),(fall_capture,'image/png'),(curve_capture,'image/png'),(map_capture,'image/png'),(source,'application/zip'),(credits_capture,'image/png')]+[(p,'image/png')\
        \ for p in biome_captures]:\n    req=urllib.request.Request(upload+'?name='+path.name,data=path.read_bytes(),headers={**headers,'Content-Type':mime},method='POST')\n\
        \    with urllib.request.urlopen(req,timeout=120) as response:json.load(response)\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as out:\n    out.write('## Moto Reto 3D\\n\\n[APK y captura real]('+release['html_url']+')\\n\\nSHA256\
        \ APK: `'+hashlib.sha256(apk.read_bytes()).hexdigest()+'`\\n')\n"
    - name: Guardar registros completos de Godot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Moto-Reto-Registros
        path: _moto_reto/build/validation/*.log
        if-no-files-found: warn

